<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squirrel Hold'em - Display</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .display-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .game-state {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      z-index: 10;
    }

    /* Poker Table */
    .poker-table-container {
      position: relative;
      width: 80vw;
      max-width: 1000px;
      height: 60vh;
      max-height: 600px;
    }

    .poker-table {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f4c29 0%, #1a6b3f 100%);
      border-radius: 50%;
      border: 20px solid #8b4513;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.5);
    }

    /* Table Center */
    .table-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
    }

    .pot-display-table {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 15px;
      padding: 15px 30px;
      margin-bottom: 15px;
    }

    .pot-amount {
      font-size: 36px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .pot-label {
      font-size: 16px;
      color: #fff;
      margin-bottom: 5px;
    }

    .community-cards-display {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    /* Player Seats */
    .player-seat {
      position: absolute;
      width: 180px;
      transform: translate(-50%, -50%);
    }

    .player-seat-inner {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 12px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-align: center;
    }

    .player-seat.active .player-seat-inner {
      border-color: #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      background: rgba(255, 215, 0, 0.15);
    }

    .player-seat.dealer::before {
      content: '🎯';
      position: absolute;
      top: -15px;
      right: -15px;
      font-size: 30px;
      z-index: 10;
    }

    .player-seat.folded .player-seat-inner {
      opacity: 0.5;
      filter: grayscale(100%);
    }

    .player-name-display {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #fff;
    }

    .player-chips-display {
      font-size: 16px;
      color: #ffd700;
      margin: 5px 0;
    }

    .player-bet-display {
      font-size: 14px;
      color: #4CAF50;
      margin: 3px 0;
    }

    .player-action-display {
      font-size: 14px;
      font-weight: bold;
      margin-top: 8px;
      padding: 5px 10px;
      border-radius: 8px;
      display: inline-block;
    }

    .action-fold { background: #e74c3c; color: white; }
    .action-check { background: #3498db; color: white; }
    .action-call { background: #2ecc71; color: white; }
    .action-raise { background: #f39c12; color: white; }
    .action-bet { background: #9b59b6; color: white; }

    .disconnected-indicator {
      color: #e74c3c;
      font-size: 20px;
      margin-left: 5px;
    }

    /* Showdown Modal */
    .showdown-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .showdown-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .showdown-title {
      font-size: 48px;
      text-align: center;
      margin-bottom: 30px;
      color: #ffd700;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
    }

    .showdown-player {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      margin: 20px 0;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    .showdown-player.winner {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }

    .showdown-player-name {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .showdown-player.winner .showdown-player-name::after {
      content: ' 🏆';
    }

    .showdown-hand-name {
      font-size: 24px;
      color: #4CAF50;
      margin: 10px 0;
    }

    .showdown-cards {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }

    .showdown-winnings {
      font-size: 28px;
      color: #ffd700;
      margin-top: 15px;
    }

    .admin-link {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.3s;
      z-index: 100;
    }

    .admin-link:hover {
      color: rgba(255, 255, 255, 1);
    }

    .skip-button {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      display: none;
    }

    .skip-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .skip-button:active {
      transform: translateY(0);
    }

    .skip-button.visible {
      display: block;
    }

    .info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      padding: 15px;
      z-index: 100;
      min-width: 200px;
    }

    .info-item {
      margin: 8px 0;
      font-size: 16px;
      color: #fff;
    }

    .info-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .info-value {
      color: #ffd700;
      font-weight: bold;
      font-size: 18px;
    }

    .timer-value {
      color: #2ecc71;
      font-weight: bold;
      font-size: 18px;
    }

    .timer-value.warning {
      color: #e74c3c;
    }

    .control-buttons {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .control-button {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .control-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .control-button:active {
      transform: translateY(0);
    }

    .control-button.pause-button {
      background: linear-gradient(135deg, #f39c12 0%, #d68910 100%);
    }

    .control-button.pause-button.paused {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }

    .control-button.skip-button {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .control-button.skip-button.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .control-button.mute-button {
      background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
    }

    .control-button.mute-button.muted {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }

    .paused-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 500;
    }

    .paused-overlay.visible {
      display: flex;
    }

    .paused-message {
      background: rgba(0, 0, 0, 0.9);
      padding: 40px 60px;
      border-radius: 20px;
      font-size: 48px;
      font-weight: bold;
      color: #f39c12;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="display-container">
    <div class="paused-overlay" id="pausedOverlay">
      <div class="paused-message">
        ⏸️ GAME PAUSED ⏸️
      </div>
    </div>

    <div class="info-panel">
      <div class="info-item">
        <div class="info-label">Blinds</div>
        <div class="info-value" id="blindsDisplay">$1 / $2</div>
      </div>
      <div class="info-item" id="timerSection" style="display: none;">
        <div class="info-label">Next Blind Increase</div>
        <div class="timer-value" id="timerDisplay">15:00</div>
      </div>
    </div>
    <a href="admin.html" class="admin-link">⚙️ Admin</a>
    <div class="logo">🐿️ SQUIRREL HOLD'EM 🃏</div>
    <div class="game-state" id="gameState">WAITING FOR PLAYERS</div>

    <div class="control-buttons">
      <button class="control-button pause-button" id="pauseButton" onclick="togglePause()">⏸️ Pause</button>
      <button class="control-button skip-button" id="skipButton" onclick="skipPlayer()">⏭️ Skip</button>
      <button class="control-button mute-button" id="muteButton" onclick="toggleMute()">🔊 Sound</button>
    </div>

    <!-- Manual Dealing Buttons (Real Chips Mode) -->
    <div class="control-buttons" id="manualDealingButtons" style="bottom: 80px; display: none;">
      <button class="control-button" onclick="manualNewDeal()" style="background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);">🃏 New Deal</button>
      <button class="control-button" id="flopBtn" onclick="manualDealFlop()" style="display: none;">Flop</button>
      <button class="control-button" id="turnBtn" onclick="manualDealTurn()" style="display: none;">Turn</button>
      <button class="control-button" id="riverBtn" onclick="manualDealRiver()" style="display: none;">River</button>
    </div>

    <div class="poker-table-container">
      <div class="poker-table"></div>

      <div class="table-center">
        <div class="pot-display-table">
          <div class="pot-label">POT</div>
          <div class="pot-amount" id="potAmount">$0</div>
        </div>
        <div class="community-cards-display" id="communityCards">
          <!-- Community cards here -->
        </div>
      </div>

      <!-- Player seats will be positioned around the table -->
      <div id="playerSeats"></div>
    </div>
  </div>

  <!-- Showdown Modal -->
  <div class="showdown-modal" id="showdownModal">
    <div class="showdown-content">
      <div class="showdown-title">🏆 SHOWDOWN! 🏆</div>
      <div id="showdownResults"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentShowdownResults = null;
    let soundMuted = false;
    let isPaused = false;

    const gameStateEl = document.getElementById('gameState');
    const potAmountEl = document.getElementById('potAmount');
    const communityCardsEl = document.getElementById('communityCards');
    const playerSeatsEl = document.getElementById('playerSeats');

    // Sound System using Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
      if (soundMuted) return;

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      switch(type) {
        case 'newHand':
          // Upward arpeggio
          oscillator.frequency.setValueAtTime(440, now);
          oscillator.frequency.setValueAtTime(554, now + 0.1);
          oscillator.frequency.setValueAtTime(659, now + 0.2);
          gainNode.gain.setValueAtTime(0.3, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          oscillator.start(now);
          oscillator.stop(now + 0.4);
          break;

        case 'bet':
          // Single tone
          oscillator.frequency.value = 523;
          oscillator.type = 'sine';
          gainNode.gain.setValueAtTime(0.2, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          oscillator.start(now);
          oscillator.stop(now + 0.15);
          break;

        case 'raise':
          // Double tone
          oscillator.frequency.setValueAtTime(523, now);
          oscillator.frequency.setValueAtTime(659, now + 0.1);
          oscillator.type = 'sine';
          gainNode.gain.setValueAtTime(0.25, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          oscillator.start(now);
          oscillator.stop(now + 0.25);
          break;

        case 'fold':
          // Downward tone
          oscillator.frequency.setValueAtTime(523, now);
          oscillator.frequency.exponentialRampToValueAtTime(200, now + 0.2);
          oscillator.type = 'sine';
          gainNode.gain.setValueAtTime(0.15, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          oscillator.start(now);
          oscillator.stop(now + 0.2);
          break;

        case 'flop':
          // Three quick tones
          oscillator.frequency.setValueAtTime(392, now);
          oscillator.frequency.setValueAtTime(440, now + 0.08);
          oscillator.frequency.setValueAtTime(494, now + 0.16);
          oscillator.type = 'triangle';
          gainNode.gain.setValueAtTime(0.25, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          oscillator.start(now);
          oscillator.stop(now + 0.3);
          break;

        case 'turn':
          // Single higher tone
          oscillator.frequency.value = 587;
          oscillator.type = 'triangle';
          gainNode.gain.setValueAtTime(0.25, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          oscillator.start(now);
          oscillator.stop(now + 0.2);
          break;

        case 'river':
          // Higher tone with vibrato
          oscillator.frequency.value = 659;
          oscillator.type = 'triangle';
          gainNode.gain.setValueAtTime(0.25, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          oscillator.start(now);
          oscillator.stop(now + 0.25);
          break;

        case 'winner':
          // Victory fanfare
          oscillator.frequency.setValueAtTime(523, now);
          oscillator.frequency.setValueAtTime(659, now + 0.15);
          oscillator.frequency.setValueAtTime(784, now + 0.3);
          oscillator.frequency.setValueAtTime(1046, now + 0.45);
          oscillator.type = 'square';
          gainNode.gain.setValueAtTime(0.3, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
          oscillator.start(now);
          oscillator.stop(now + 0.7);
          break;
      }
    }

    // Manual dealing functions
    function manualNewDeal() {
      socket.emit('manualNewDeal');
      playSound('newHand');
    }

    function manualDealFlop() {
      socket.emit('manualDealFlop');
      playSound('flop');
    }

    function manualDealTurn() {
      socket.emit('manualDealTurn');
      playSound('turn');
    }

    function manualDealRiver() {
      socket.emit('manualDealRiver');
      playSound('river');
    }

    // Toggle pause
    function togglePause() {
      const pauseButton = document.getElementById('pauseButton');
      const pausedOverlay = document.getElementById('pausedOverlay');

      if (isPaused) {
        socket.emit('resumeGame');
      } else {
        socket.emit('pauseGame');
      }
    }

    // Toggle mute
    function toggleMute() {
      soundMuted = !soundMuted;
      const muteButton = document.getElementById('muteButton');
      muteButton.classList.toggle('muted', soundMuted);
      muteButton.textContent = soundMuted ? '🔇 Muted' : '🔊 Sound';
      localStorage.setItem('soundMuted', soundMuted);
    }

    // Load mute preference
    const savedMute = localStorage.getItem('soundMuted');
    if (savedMute === 'true') {
      soundMuted = true;
      document.getElementById('muteButton').classList.add('muted');
      document.getElementById('muteButton').textContent = '🔇 Muted';
    }
    const showdownModal = document.getElementById('showdownModal');
    const showdownResultsEl = document.getElementById('showdownResults');

    // Track previous game state for sound triggers
    let previousGameState = null;
    let previousCommunityCardsCount = 0;

    function getSuitSymbol(suit) {
      const symbols = {
        hearts: '♥',
        diamonds: '♦',
        clubs: '♣',
        spades: '♠'
      };
      return symbols[suit] || suit;
    }

    function createCard(card, size = 'normal') {
      const cardDiv = document.createElement('div');
      const sizeClass = size === 'xlarge' ? 'card-xlarge' : (size === 'large' ? 'card-large' : '');
      cardDiv.className = `card ${card.suit} ${sizeClass}`;

      const rankTop = document.createElement('div');
      rankTop.className = 'card-rank';
      rankTop.textContent = card.rank;

      const suitSymbol = document.createElement('div');
      suitSymbol.className = 'card-suit';
      suitSymbol.textContent = getSuitSymbol(card.suit);

      const rankBottom = document.createElement('div');
      rankBottom.className = 'card-rank-bottom';
      rankBottom.textContent = card.rank;

      cardDiv.appendChild(rankTop);
      cardDiv.appendChild(suitSymbol);
      cardDiv.appendChild(rankBottom);

      return cardDiv;
    }

    function getPlayerPosition(seatPosition, maxSeats = 10) {
      // Position players around an ellipse based on their seat position
      // This ensures players appear in their chosen seat, matching physical positions
      const angle = (seatPosition / maxSeats) * 2 * Math.PI - Math.PI / 2; // Start at top
      const radiusX = 45; // Horizontal radius (%)
      const radiusY = 40; // Vertical radius (%)

      const x = 50 + radiusX * Math.cos(angle);
      const y = 50 + radiusY * Math.sin(angle);

      return { x, y };
    }

    function getActionDisplay(action, amount) {
      if (!action) return '';

      const actionTexts = {
        fold: 'FOLD',
        check: 'CHECK',
        call: `CALL $${amount}`,
        raise: `RAISE $${amount}`,
        bet: `BET $${amount}`
      };

      const text = actionTexts[action] || action.toUpperCase();
      return `<div class="player-action-display action-${action}">${text}</div>`;
    }

    function updateDisplay(gameState) {
      // Handle pause state
      const pausedOverlay = document.getElementById('pausedOverlay');
      const pauseButton = document.getElementById('pauseButton');
      isPaused = gameState.paused;

      if (gameState.paused) {
        pausedOverlay.classList.add('visible');
        pauseButton.classList.add('paused');
        pauseButton.textContent = '▶️ Resume';
      } else {
        pausedOverlay.classList.remove('visible');
        pauseButton.classList.remove('paused');
        pauseButton.textContent = '⏸️ Pause';
      }

      // Detect game state transitions and play sounds
      if (previousGameState !== gameState.gameState) {
        if (gameState.gameState === 'preflop' && previousGameState === 'dealing') {
          playSound('newHand');
        } else if (gameState.gameState === 'flop') {
          playSound('flop');
        } else if (gameState.gameState === 'turn') {
          playSound('turn');
        } else if (gameState.gameState === 'river') {
          playSound('river');
        }
        previousGameState = gameState.gameState;
      }

      // Update game state display
      const states = {
        waiting: 'WAITING FOR PLAYERS',
        dealing: 'DEALING CARDS',
        preflop: 'PRE-FLOP',
        flop: 'FLOP',
        turn: 'TURN',
        river: 'RIVER',
        showdown: 'SHOWDOWN'
      };
      gameStateEl.textContent = states[gameState.gameState] || gameState.gameState.toUpperCase();

      // Show/hide skip button (not needed in real chips mode)
      const skipButton = document.getElementById('skipButton');
      const useRealChips = gameState.config && gameState.config.useRealChips;

      if (!useRealChips && gameState.gameState !== 'waiting' && gameState.gameState !== 'showdown' && gameState.players.length > 0) {
        skipButton.classList.add('visible');
      } else {
        skipButton.classList.remove('visible');
      }

      // Show/hide manual dealing buttons
      const manualDealingButtons = document.getElementById('manualDealingButtons');
      const flopBtn = document.getElementById('flopBtn');
      const turnBtn = document.getElementById('turnBtn');
      const riverBtn = document.getElementById('riverBtn');

      if (useRealChips) {
        manualDealingButtons.style.display = 'flex';

        // Show/hide buttons based on game state
        flopBtn.style.display = gameState.gameState === 'preflop' ? 'block' : 'none';
        turnBtn.style.display = gameState.gameState === 'flop' ? 'block' : 'none';
        riverBtn.style.display = gameState.gameState === 'turn' ? 'block' : 'none';
      } else {
        manualDealingButtons.style.display = 'none';
      }

      // Update blinds display
      if (gameState.blinds) {
        document.getElementById('blindsDisplay').textContent = `$${gameState.blinds.small} / $${gameState.blinds.big}`;
      }

      // Update timer display
      const timerSection = document.getElementById('timerSection');
      const timerDisplay = document.getElementById('timerDisplay');
      if (gameState.config && gameState.config.blindTimerEnabled && gameState.blindTimer) {
        timerSection.style.display = 'block';
        const minutes = gameState.blindTimer.remainingMinutes;
        const seconds = gameState.blindTimer.remainingSeconds;
        timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

        // Change color to red if less than 2 minutes
        if (minutes < 2) {
          timerDisplay.classList.add('warning');
        } else {
          timerDisplay.classList.remove('warning');
        }
      } else {
        timerSection.style.display = 'none';
      }

      // Update pot
      potAmountEl.textContent = `$${gameState.pot}`;

      // Update community cards
      communityCardsEl.innerHTML = '';
      if (gameState.communityCards && gameState.communityCards.length > 0) {
        gameState.communityCards.forEach(card => {
          communityCardsEl.appendChild(createCard(card, 'xlarge')); // Use extra large cards for better visibility
        });
      }

      // Update players around the table
      playerSeatsEl.innerHTML = '';
      const maxSeats = gameState.config ? gameState.config.maxPlayers : 10;
      gameState.players.forEach((player, index) => {
        // Use the player's seat position if available, otherwise fall back to index
        const seatPos = player.seatPosition !== undefined ? player.seatPosition : index;
        const position = getPlayerPosition(seatPos, maxSeats);

        const seat = document.createElement('div');
        seat.className = 'player-seat';
        seat.style.left = `${position.x}%`;
        seat.style.top = `${position.y}%`;

        if (index === gameState.currentPlayerIndex && gameState.gameState !== 'waiting') {
          seat.classList.add('active');
        }

        if (index === gameState.dealerIndex) {
          seat.classList.add('dealer');
        }

        if (player.folded) {
          seat.classList.add('folded');
        }

        const connectedIndicator = player.connected ? '' : '<span class="disconnected-indicator">●</span>';
        const betDisplay = player.bet > 0 ? `<div class="player-bet-display">Bet: $${player.bet}</div>` : '';
        const actionDisplay = player.lastAction ? getActionDisplay(player.lastAction, player.lastActionAmount) : '';
        const statusDisplay = player.folded ? '<div style="color: #e74c3c; font-weight: bold;">FOLDED</div>' :
                             player.allIn ? '<div style="color: #f39c12; font-weight: bold;">ALL IN</div>' : '';
        const seatLabel = seatPos !== undefined ? `<div style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 3px;">Seat ${seatPos + 1}</div>` : '';

        seat.innerHTML = `
          <div class="player-seat-inner">
            <div class="player-name-display">${player.name}${connectedIndicator}</div>
            ${seatLabel}
            <div class="player-chips-display">💰 $${player.chips}</div>
            ${betDisplay}
            ${statusDisplay}
            ${actionDisplay}
          </div>
        `;

        playerSeatsEl.appendChild(seat);
      });
    }

    function skipPlayer() {
      if (confirm('Skip the current player and fold their hand?')) {
        socket.emit('skipPlayer');
      }
    }

    function displayShowdown(results) {
      if (!results || results.length === 0) return;

      showdownResultsEl.innerHTML = '';

      results.forEach(result => {
        const playerDiv = document.createElement('div');
        playerDiv.className = 'showdown-player';
        if (result.isWinner) {
          playerDiv.classList.add('winner');
        }

        const cardsContainer = document.createElement('div');
        cardsContainer.className = 'showdown-cards';
        result.player.cards.forEach(card => {
          cardsContainer.appendChild(createCard(card, 'xlarge')); // Use extra large cards for better visibility
        });

        const winningsHTML = result.isWinner ?
          `<div class="showdown-winnings">Won $${result.winAmount}!</div>` : '';

        playerDiv.innerHTML = `
          <div class="showdown-player-name">${result.player.name}</div>
          <div class="showdown-hand-name">${result.handName}</div>
        `;
        playerDiv.appendChild(cardsContainer);
        if (winningsHTML) {
          playerDiv.innerHTML += winningsHTML;
        }

        showdownResultsEl.appendChild(playerDiv);
      });

      showdownModal.style.display = 'block';

      // Auto-hide after 8 seconds
      setTimeout(() => {
        showdownModal.style.display = 'none';
      }, 8000);
    }

    // Socket event listeners
    socket.on('gameState', (gameState) => {
      updateDisplay(gameState);

      // Detect player actions and play sounds
      if (gameState.players) {
        gameState.players.forEach(player => {
          if (player.lastAction) {
            // Only play sound for recent actions (you could add timestamp checking if needed)
            if (player.lastAction === 'bet') {
              playSound('bet');
            } else if (player.lastAction === 'raise') {
              playSound('raise');
            } else if (player.lastAction === 'fold') {
              playSound('fold');
            }
          }
        });
      }
    });

    socket.on('gameStarted', () => {
      console.log('Game started!');
    });

    socket.on('showdown', (results) => {
      console.log('Showdown results:', results);
      currentShowdownResults = results;
      displayShowdown(results);
      playSound('winner');
    });

    socket.on('gamePaused', () => {
      console.log('Game paused');
    });

    socket.on('gameResumed', () => {
      console.log('Game resumed');
    });

    socket.on('handEnded', () => {
      console.log('Hand ended');
    });

    socket.on('playerSkipped', (data) => {
      console.log('Player skipped:', data.playerName);
    });

    // Close showdown modal on click
    showdownModal.addEventListener('click', () => {
      showdownModal.style.display = 'none';
    });

    console.log('Display connected to server');
  </script>
</body>
</html>
